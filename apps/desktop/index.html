<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/branding/volumia-icon-final.svg" />
    <title>VOLUMIA</title>
    <style>
      /* Minimal theme fallbacks to avoid a fully blank screen before JS theme loads */
      :root{
        --bg: #0D111B;
        --surface-1: #151B29;
        --text: #F4F7FC;
        --accent: #4C6FFF;
        --accent-2: #7C5CFC;
        --boot-glow: radial-gradient(circle at 50% 38%, rgba(76,111,255,0.18), transparent 33%);
      }
      html,body,#root{height:100%;}
      body{background:var(--bg);color:var(--text);}

      /* Simple centered fallback splash */
      #fallback-splash{
        position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:Inter,system-ui,sans-serif;
        background:var(--bg);color:var(--text);
      }
      #fallback-splash .box{display:flex;flex-direction:column;align-items:center;gap:12px}
      #fallback-splash h1{margin:0;font-size:28px;letter-spacing:0.14em}
      #fallback-splash p{margin:0;font-size:12px;color:var(--text);opacity:0.86}
      @keyframes fd{0%{opacity:0.18;transform:translateY(0)}30%{opacity:1;transform:translateY(-6px)}60%{opacity:.6;transform:translateY(0)}100%{opacity:.18;transform:translateY(0)}}
      #fallback-splash .dots{display:flex;gap:8px;margin-top:8px}
      #fallback-splash .dot{width:10px;height:10px;border-radius:999px;background:var(--accent);opacity:0.18;animation:fd 1.2s ease-in-out infinite}
      #fallback-splash .dot:nth-child(2){animation-delay:.12s}
      #fallback-splash .dot:nth-child(3){animation-delay:.24s}
      #fallback-splash .dot:nth-child(4){animation-delay:.36s}
      #fallback-splash .dot:nth-child(5){animation-delay:.48s}
      @media (prefers-reduced-motion: reduce){#fallback-splash .dot{animation:none;opacity:1}}
    </style>
  </head>
  <body>
    <div id="fallback-splash" aria-hidden>
      <div class="box">
        <div style="width:84px;height:84px;display:flex;align-items:center;justify-content:center;color:var(--accent);">
          <!-- simple V mark as fallback -->
          <svg width="72" height="72" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <path d="M318 248H478L558 624H470L318 248Z" fill="currentColor" opacity="0.98"/>
            <path d="M318 248L558 624" stroke="currentColor" stroke-width="18" stroke-opacity="0.9"/>
          </svg>
        </div>
        <h1>VOLUMIA</h1>
        <p>Iniciando espacio de trabajo 3D local</p>
        <div class="dots" aria-hidden>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
