name: service-tests

on:
  push:
    paths:
      - "apps/service/**"
      - "scripts/test_service.ps1"
      - ".github/workflows/service-tests.yml"
  pull_request:
    paths:
      - "apps/service/**"
      - "scripts/test_service.ps1"
      - ".github/workflows/service-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/service/requirements.txt pytest

      - name: Run service tests
        run: pytest apps/service/tests -q
